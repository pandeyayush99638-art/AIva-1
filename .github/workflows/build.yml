name: Build Aiva APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: |
          if [ -f Aiva.zip ]; then unzip -oq Aiva.zip; fi
          cd Aiva
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Aiva-apk
          path: Aiva/app/build/outputs/apk/debug/app-debug.apk
